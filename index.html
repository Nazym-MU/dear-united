<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dear United</title>
    <link rel="preload" href="fonts/Qw3EZQFXECDrI2q789EKQZJob0x6XHgOiJM6.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/XRXV3I6Li01BKofINeaBTMnFcQ.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/m8JQjfZSc7OXlB3ZMOjDd5RARGmK3Q.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <style>
      html { background: #0d0c0a; }
      /* Hide the page (not the boot loader) until fonts + layout settle. */
      #letter-scroll, #stadium-live { opacity: 0; }
      body.ready #letter-scroll, body.ready #stadium-live { opacity: 1; transition: opacity 0.45s ease; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0c0a;
        opacity: 1;
        transition: opacity 0.5s ease;
      }
      #boot.hide { opacity: 0; pointer-events: none; }
      .boot-dots { display: flex; gap: 9px; }
      .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(233, 227, 214, 0.55);
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) { animation-delay: 0.15s; }
      .boot-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-dot {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-dots span { animation: none; }
      }
    </style>
  </head>
  <body class="letter-page">
    <div id="boot" aria-hidden="true"><div class="boot-dots"><span></span><span></span><span></span></div></div>
    <div id="letter-scroll">
      <div id="letter-stage">
        <div id="envelope-wrap">
          <div id="envelope">
            <div class="env-back"></div>

            <div class="env-pocket">
              <article id="letter-sheet" aria-label="A letter to Manchester United">
                <div class="sheet-inner">
                  <p class="sheet-salutation" id="sheet-salutation"></p>
                  <div id="sheet-body"></div>
                  <p class="sheet-signoff" id="sheet-signoff"></p>
                  <p class="sheet-signature" id="sheet-signature"></p>
                </div>
              </article>
            </div>

            <div class="env-front">
              <div class="env-address">
                <p class="env-addressee" id="env-addressee"></p>
                <div class="env-address-lines" id="env-address-lines"></div>
              </div>

              <div class="env-stamp">
                <img class="stamp-crest" src="crest.png" alt="Manchester United crest" />
              </div>

              <div class="env-postmark">
                <svg viewBox="0 0 200 200" aria-hidden="true">
                  <circle cx="100" cy="100" r="92" fill="none" stroke-width="5" />
                  <circle cx="100" cy="100" r="66" fill="none" stroke-width="3" />
                  <defs>
                    <path id="pm-top" d="M 100 100 m -78 0 a 78 78 0 0 1 156 0" />
                    <path id="pm-bottom" d="M 100 100 m -78 0 a 78 78 0 0 0 156 0" />
                  </defs>
                  <text class="pm-text" font-size="21">
                    <textPath href="#pm-top" startOffset="50%" text-anchor="middle">MANCHESTER</textPath>
                  </text>
                  <text class="pm-text" font-size="17">
                    <textPath href="#pm-bottom" startOffset="50%" text-anchor="middle">EST 1878</textPath>
                  </text>
                  <line x1="34" y1="86" x2="166" y2="86" stroke-width="4" />
                  <line x1="34" y1="114" x2="166" y2="114" stroke-width="4" />
                  <text class="pm-date" x="100" y="108" text-anchor="middle" font-size="20">OLD TRAFFORD</text>
                </svg>
              </div>
            </div>

            <div class="env-flap">
              <div class="env-flap-face"></div>
              <div class="env-seal" id="env-seal">
                <svg viewBox="-8 -8 116 116" aria-hidden="true">
                  <defs>
                    <filter id="seal-shadow" x="-30%" y="-30%" width="160%" height="160%">
                      <feGaussianBlur stdDeviation="2.6" />
                    </filter>
                    <radialGradient id="wax" cx="42%" cy="38%" r="72%">
                      <stop offset="0%" stop-color="#ecc76a" />
                      <stop offset="45%" stop-color="#d3a23e" />
                      <stop offset="80%" stop-color="#b7852c" />
                      <stop offset="100%" stop-color="#9d6f22" />
                    </radialGradient>
                    <radialGradient id="wax-press" cx="50%" cy="46%" r="55%">
                      <stop offset="0%" stop-color="#c8973a" />
                      <stop offset="78%" stop-color="#bd8c33" />
                      <stop offset="100%" stop-color="#dcb257" />
                    </radialGradient>
                  </defs>
                  <path
                    d="M 50 5 C 61 3, 72 9, 79 17 C 86 24, 96 30, 95 42 C 94 51, 97 61, 92 70 C 87 80, 77 82, 68 88 C 60 94, 48 97, 39 92 C 30 87, 19 85, 12 76 C 6 68, 8 57, 6 47 C 4 36, 11 27, 18 20 C 26 12, 39 7, 50 5 Z"
                    fill="rgba(0, 0, 0, 0.42)"
                    transform="translate(2, 5.5)"
                    filter="url(#seal-shadow)"
                  />
                  <path
                    d="M 50 5 C 61 3, 72 9, 79 17 C 86 24, 96 30, 95 42 C 94 51, 97 61, 92 70 C 87 80, 77 82, 68 88 C 60 94, 48 97, 39 92 C 30 87, 19 85, 12 76 C 6 68, 8 57, 6 47 C 4 36, 11 27, 18 20 C 26 12, 39 7, 50 5 Z"
                    fill="#7a5514"
                    transform="translate(0, 3.4)"
                  />
                  <path
                    d="M 50 5 C 61 3, 72 9, 79 17 C 86 24, 96 30, 95 42 C 94 51, 97 61, 92 70 C 87 80, 77 82, 68 88 C 60 94, 48 97, 39 92 C 30 87, 19 85, 12 76 C 6 68, 8 57, 6 47 C 4 36, 11 27, 18 20 C 26 12, 39 7, 50 5 Z"
                    fill="url(#wax)"
                  />
                  <path
                    d="M 50 5 C 61 3, 72 9, 79 17 C 86 24, 96 30, 95 42 C 94 51, 97 61, 92 70 C 87 80, 77 82, 68 88 C 60 94, 48 97, 39 92 C 30 87, 19 85, 12 76 C 6 68, 8 57, 6 47 C 4 36, 11 27, 18 20 C 26 12, 39 7, 50 5 Z"
                    fill="none"
                    stroke="rgba(0,0,0,0.22)"
                    stroke-width="1.4"
                  />
                  <ellipse cx="38" cy="26" rx="20" ry="10" fill="rgba(255,255,255,0.2)" transform="rotate(-24 38 26)" />
                  <circle cx="50" cy="51" r="31" fill="url(#wax-press)" />
                  <circle cx="50" cy="51" r="31" fill="none" stroke="rgba(0,0,0,0.28)" stroke-width="1.6" />
                  <circle cx="50" cy="51" r="28" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
                  <text x="50" y="60" text-anchor="middle" class="seal-mark-shadow">MU</text>
                  <text x="50" y="59" text-anchor="middle" class="seal-mark">MU</text>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <section id="stadium-live" aria-label="Old Trafford, piece by piece">
      <canvas id="stadium-canvas"></canvas>
      <div id="stadium-loading" aria-hidden="true">
        <div id="stadium-loading-bar"></div>
      </div>
      <p id="stadium-hint">Drag to look around</p>
      <a id="album-link" href="album.html" aria-label="Player Album" title="Player Album">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z" />
          <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5" />
          <circle cx="11" cy="9" r="1.6" />
          <path d="M20 13.5l-3.2-3.2-4.3 4.3-1.7-1.7L8 15.7" />
        </svg>
      </a>
    </section>

    <script type="module" src="/src/letter.js"></script>
    <script type="module" src="/src/united.js"></script>
  </body>
</html>
